services:
  kanban:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kanban-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  kanban-data:
